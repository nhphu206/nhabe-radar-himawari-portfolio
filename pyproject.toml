[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nhabe-radar-himawari"
version = "1.1.0"
description = "Reproducible radar-Himawari preprocessing and ten-minute reflectivity forecasting"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Nguyen Hoai Phu"}]
license = {file = "LICENSE"}
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
  "arm-pyart==2.2.5",
  "satpy==0.60.0",
  "pyresample==1.35.0",
  "PyYAML==6.0.3",
  "aiohttp==3.14.3",
  "numpy==2.5.2",
]

[project.scripts]
nhabe-pipeline = "nhabe_preprocessing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
